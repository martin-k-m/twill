name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./internal/tensor/ ./internal/interp/

      - name: Build binary
        run: go build -o raster ./cmd/raster

      - name: Run examples (smoke test)
        run: |
          ./raster examples/hello.ra
          ./raster examples/autodiff.ra
          ./raster examples/linreg.ra
          ./raster examples/nn_xor.ra
          ./raster examples/classifier.ra
          ./raster examples/records.ra
          ./raster examples/einsum.ra
          ./raster examples/montecarlo_option.ra
          ./raster examples/frames.ra
          ./raster examples/units.ra
          ./raster examples/gbm.ra
          ./raster examples/backtest.ra
          ./raster examples/signal_opt.ra
          ./raster check examples/shapes.ra
          ./raster fmt examples/hello.ra >/dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Dead code
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@latest ./...)"
          if [ -n "$out" ]; then echo "$out"; echo "::error::dead code found"; exit 1; fi

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
