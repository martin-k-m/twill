name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./internal/tensor/ ./internal/interp/

      - name: Build binary
        run: go build -o twill ./cmd/twill

      - name: Run examples (smoke test)
        run: |
          ./twill examples/hello.tw
          ./twill examples/autodiff.tw
          ./twill examples/linreg.tw
          ./twill examples/nn_xor.tw
          ./twill examples/classifier.tw
          ./twill examples/records.tw
          ./twill examples/einsum.tw
          ./twill examples/montecarlo_option.tw
          ./twill examples/frames.tw
          ./twill examples/units.tw
          ./twill examples/gbm.tw
          ./twill examples/backtest.tw
          ./twill examples/signal_opt.tw
          ./twill examples/cnn.tw
          ./twill examples/save_load.tw
          ./twill examples/minibatch.tw
          ./twill examples/attention.tw
          ./twill examples/jacobian.tw
          ./twill examples/hessian.tw
          ./twill check examples/shapes.tw
          ./twill fmt examples/hello.tw >/dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Dead code
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@latest ./...)"
          if [ -n "$out" ]; then echo "$out"; echo "::error::dead code found"; exit 1; fi

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
