name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binary
        run: go build -o aster ./cmd/aster

      - name: Run examples (smoke test)
        run: |
          ./aster examples/hello.ast
          ./aster examples/autodiff.ast
          ./aster examples/linreg.ast
          ./aster examples/nn_xor.ast
          ./aster check examples/shapes.ast
