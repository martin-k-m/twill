<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="twill">
  <title>twill</title>
  <defs>
    <linearGradient id="twg-face" x1="380" y1="52" x2="150" y2="455" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D2F0E4"/>
      <stop offset="0.5" stop-color="#A8DCCB"/>
      <stop offset="1" stop-color="#7FE3C4"/>
    </linearGradient>
    <linearGradient id="twg-back" x1="253" y1="201" x2="152" y2="455" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FB79B"/>
      <stop offset="1" stop-color="#3E9A83"/>
    </linearGradient>
    <!-- Wide region so the bloom is not clipped at the viewBox edge. -->
    <filter id="twg-bloom" x="-40%" y="-30%" width="180%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="twg-halo" x="-25%" y="-20%" width="150%" height="140%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- Bloom sits behind the mark in the accent tone; on a light background it
       turns to haze, which is why this variant is dark-background only. -->
  <path fill="#7FE3C4" opacity="0.55" filter="url(#twg-bloom)" d="M126 186
    C180 142 285 90 380 52
    C397 76 398 106 391 130
    C350 158 300 180 253 201
    L252 300
    C251 308 249 312 246 317
    C200 380 168 428 152 455
    C140 424 130 375 138 322
    C137 310 130 288 124 272
    C114 244 114 212 126 186 Z"/>

  <path fill="#A8DCCB" opacity="0.5" filter="url(#twg-halo)" d="M126 186
    C180 142 285 90 380 52
    C397 76 398 106 391 130
    C350 158 300 180 253 201
    L252 300
    C251 308 249 312 246 317
    C200 380 168 428 152 455
    C140 424 130 375 138 322
    C137 310 130 288 124 272
    C114 244 114 212 126 186 Z"/>

  <path fill="url(#twg-face)" d="M126 186
    C180 142 285 90 380 52
    C397 76 398 106 391 130
    C350 158 300 180 253 201
    L252 300
    C251 308 249 312 246 317
    C200 380 168 428 152 455
    C140 424 130 375 138 322
    C137 310 130 288 124 272
    C114 244 114 212 126 186 Z"/>

  <path fill="url(#twg-back)" d="M252 214
    C210 250 172 282 138 322
    C137 310 130 288 124 272
    C144 242 188 219 253 201 Z"/>

  <path fill="url(#twg-back)" d="M246 317
    C226 346 168 384 144 434
    C147 443 150 451 152 455
    C168 428 200 380 246 317 Z"/>
</svg>
